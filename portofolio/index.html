    <!-- Theme and language before first paint, so nothing flashes. Storage access is guarded. -->
    <script>
      (function () {
        var d = document.documentElement;
        try {
          var p = localStorage.getItem('homyvest:theme');
          var dark = p === 'dark' || (p !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          d.dataset.theme = dark ? 'dark' : 'light';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m && dark) m.setAttribute('content', '#0c0c0b');
        } catch (e) {
          try {
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) d.dataset.theme = 'dark';
          } catch (e2) {}
        }
        try {
          var l = new URLSearchParams(location.search).get('lang') || localStorage.getItem('homyvest:lang');
          if (l === 'id' || l === 'en') d.lang = l;
        } catch (e) {}
      })();
    </script>
    <style>
      /* First paint, before the stylesheet arrives */
      html { background: #fafaf7; }
      html[data-theme='dark'] { background: #0c0c0b; }
    </style>
