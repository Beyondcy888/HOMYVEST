[build]
  command = "npm run build"
  publish = "dist"

# The portfolio page lives at /portofolio/ (with the slash). Netlify's Pretty URLs already send
# /portofolio to /portofolio/ (a rule for it would loop: Netlify matches rules with or without the
# trailing slash). The English spelling, with or without the slash, redirects there (301).
[[redirects]]
  from = "/portfolio"
  to = "/portofolio/"
  status = 301
  force = true

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/portofolio/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/portofolio/index.html"
  [headers.values]
    Cache-Control = "no-cache"
